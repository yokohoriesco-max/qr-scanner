<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード読み取り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    #reader {
      width: 100%;
      min-height: 80px;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }

    #message {
      margin: 15px 0;
      text-align: center;
      white-space: pre-line;
      font-weight: bold;
      line-height: 1.6;
    }

    .error {
      color: #d32f2f;
    }

    .success {
      color: #2e7d32;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #2e7d32;
    }

    #stopButton {
      background: #d32f2f;
      display: none;
    }

    #backButton {
      background: #1976d2;
    }

    .hint {
      margin-top: 16px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QRコード読み取り</h1>

  <div class="card">

    <div id="reader"></div>

    <div id="message">
      「カメラを起動」を押してください。
    </div>

    <button
      id="startButton"
      type="button"
      onclick="startScanner()">
      📷 カメラを起動
    </button>

    <button
      id="stopButton"
      type="button"
      onclick="stopScanner()">
      カメラを停止
    </button>

    <button
      id="backButton"
      type="button"
      onclick="goBack()">
      ← 入庫管理へ戻る
    </button>

    <div class="hint">
      QRコードをカメラ中央の枠内に入れてください。<br>
      読み取り成功後、自動的に出庫処理画面へ戻ります。
    </div>

  </div>

</div>


<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>


<script>

var scanner = null;
var scanning = false;
var finished = false;


/*
 * Apps ScriptのURL
 */
var returnUrl =
  "https://script.google.com/macros/s/AKfycbwzNo1eSSIO3i2VA7UjLUj9Rj4kEWKiQPfx8xYWMuLLYoc2v5Dtkh5TY8F502Za72Q/exec";


/*
 * 画面メッセージ
 */
function setMessage(text, className) {

  var message = document.getElementById("message");

  message.textContent = text;

  message.className = className || "";
}


/*
 * ボタン表示
 */
function setButtonState(running) {

  document.getElementById("startButton").style.display =
    running ? "none" : "block";

  document.getElementById("stopButton").style.display =
    running ? "block" : "none";
}


/*
 * カメラ開始
 */
function startScanner() {

  if (scanning) {
    return;
  }

  if (typeof Html5Qrcode === "undefined") {

    setMessage(
      "QR読み取りライブラリを読み込めませんでした。",
      "error"
    );

    return;
  }

  scanner = new Html5Qrcode("reader");

  scanning = true;
  finished = false;

  setButtonState(true);

  setMessage(
    "カメラを起動しています...",
    ""
  );


  var config = {

    fps: 10,

    qrbox: function(width, height) {

      var size = Math.floor(
        Math.min(width, height) * 0.72
      );

      size = Math.max(180, Math.min(size, 320));

      return {
        width: size,
        height: size
      };
    },

    aspectRatio: 1.0
  };


  scanner.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    onScanFailure

  ).then(function() {

    setMessage(
      "カメラ起動済みです。\nQRコードを映してください。",
      ""
    );

  }).catch(function(error) {

    console.error(error);

    showCameraError(error);
  });
}


/*
 * 読み取り失敗
 */
function onScanFailure(errorMessage) {
  /*
   * 何もしない
   */
}


/*
 * QR読み取り成功
 */
function onScanSuccess(decodedText) {

  if (finished) {
    return;
  }

  finished = true;


  /*
   * 読み取った文字
   */
  var value = String(decodedText || "").trim();


  if (!value) {

    finished = false;

    return;
  }


  /*
   * URLのQRだった場合は
   * ?id=○○ を取り出す
   */
  try {

    var qrUrl = new URL(value);

    var qrId = qrUrl.searchParams.get("id");

    if (qrId) {
      value = String(qrId).trim();
    }

  } catch (e) {

    /*
     * te-pu のような普通の文字列なら
     * そのまま使用
     */
  }


  /*
   * 読み取り結果
   */
  setMessage(
    "読み取りました：\n" +
    value +
    "\n\n出庫処理画面へ戻ります...",
    "success"
  );


  /*
   * 戻り先URLを作る
   */
  var targetUrl =
    returnUrl +
    "?id=" +
    encodeURIComponent(value) +
    "&stockout=1";


  console.log("移動先：", targetUrl);


  /*
   * 0.5秒後に直接移動
   *
   * カメラ停止を待たない。
   */
setTimeout(function() {

  alert("これから移動します\n\n" + targetUrl);

  window.location.href = targetUrl;

}, 500);

/*
 * カメラ停止
 */
function stopScanner() {

  if (!scanner || !scanning) {

    scanning = false;

    setButtonState(false);

    return;
  }


  scanner.stop().then(function() {

    try {
      scanner.clear();
    } catch (e) {
      console.log(e);
    }

    scanner = null;

    scanning = false;

    setButtonState(false);

  }).catch(function(error) {

    console.log(error);

    scanner = null;

    scanning = false;

    setButtonState(false);
  });
}


/*
 * カメラエラー
 */
function showCameraError(error) {

  scanning = false;

  setButtonState(false);

  setMessage(
    "カメラを起動できませんでした。\n\n" +
    "スマートフォンのブラウザで\n" +
    "カメラの使用を許可してください。",
    "error"
  );

  scanner = null;
}


/*
 * 戻るボタン
 */
function goBack() {

  stopScanner();

  window.location.href = returnUrl;
}


/*
 * ページを閉じるとき
 */
window.addEventListener(
  "beforeunload",
  function() {

    if (scanner && scanning) {

      try {
        scanner.stop();
      } catch (e) {
        console.log(e);
      }
    }
  }
);

</script>

</body>
</html>
