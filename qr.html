<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRコード読み取り</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    #message {
      white-space: pre-line;
      font-size: 18px;
      margin: 15px 0;
      min-height: 50px;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      transform: none !important;
    }

    button {
      width: 100%;
      max-width: 600px;
      height: 55px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #1976d2;
      color: white;
    }

    #backButton {
      background: #666;
      color: white;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📱 QRコード読み取り</h1>

  <div id="message">
    QRコード読み取り画面です。
  </div>

  <div id="reader"></div>

  <button id="startButton" onclick="startScanner()">
    📷 カメラを起動する
  </button>

  <button id="backButton" onclick="goBack()">
    ← 戻る
  </button>

  <script>

    // ==========================================
    // 基本設定
    // ==========================================

    var scanner = null;
    var scanning = false;
    var finished = false;

    var params = new URLSearchParams(window.location.search);

    // 入庫 / 出庫
    var mode = params.get("mode") || "inbound";

    // Apps Script
    var returnUrl =
      "https://script.google.com/macros/s/AKfycbwzNo1eSSIO3i2VA7UjLUj9Rj4kEWKiQPfx8xYWMuLLYoc2v5Dtkh5TY8F502Za72Q/exec";


    // ==========================================
    // 画面メッセージ
    // ==========================================

    function setMessage(text, type) {

      var message = document.getElementById("message");

      message.className = type || "";

      message.textContent = text;
    }


    // ==========================================
    // ボタン状態
    // ==========================================

    function setButtonState(running) {

      var button = document.getElementById("startButton");

      if (running) {

        button.disabled = true;
        button.textContent = "📷 読み取り中...";

      } else {

        button.disabled = false;
        button.textContent = "📷 カメラを起動する";

      }
    }


    // ==========================================
    // QR読み取り開始
    // ==========================================

    function startScanner() {

      if (scanning) {
        return;
      }

      if (typeof Html5Qrcode === "undefined") {

        setMessage(
          "QR読み取りライブラリを読み込めませんでした。",
          "error"
        );

        return;
      }

      setMessage(
        "背面カメラを起動しています...\n少しお待ちください。",
        ""
      );

      scanner = new Html5Qrcode("reader");

      scanning = true;
      finished = false;

      setButtonState(true);


      var config = {

        fps: 20,

        qrbox: function(width, height) {

          var size =
            Math.floor(Math.min(width, height) * 0.85);

          size = Math.max(200, Math.min(size, 500));

          return {
            width: size,
            height: size
          };
        },

        aspectRatio: 1.0,

        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],

        disableFlip: true
      };


      scanner.start(

        {
          facingMode: "environment"
        },

        config,

        onScanSuccess,

        onScanFailure

      )
      .then(function() {

        setMessage(
          "カメラ起動済みです。\n\n" +
          "QRコードを画面中央に大きく映してください。",
          ""
        );

      })
      .catch(function(error) {

        console.error(error);

        scanning = false;
        finished = false;

        setButtonState(false);

        setMessage(
          "カメラを起動できませんでした。\n\n" +
          "スマートフォンのブラウザで\n" +
          "カメラの使用を許可してください。\n\n" +
          "エラー：" +
          (error.message || error),
          "error"
        );

        scanner = null;
      });
    }


    // ==========================================
    // QR読み取り成功
    // ==========================================

    function onScanSuccess(decodedText, decodedResult) {

      if (finished) {
        return;
      }

      finished = true;

      console.log("QR読み取り成功:", decodedText);

      var value = decodedText.trim();

      // ==========================================
      // QRの中身がURLだった場合
      // ==========================================

      try {

        if (
          value.indexOf("http://") === 0 ||
          value.indexOf("https://") === 0
        ) {

          var url = new URL(value);

          var qrId = url.searchParams.get("id");

          if (qrId) {
            value = qrId;
          }
        }

      } catch (error) {

        console.log("URLではありません:", value);

      }


      // ==========================================
      // 入庫
      // ==========================================

      if (mode === "inbound") {

        setMessage(
          "✅ 読み取りました\n\n" +
          value +
          "\n\n" +
          "入庫処理画面へ戻ります。",
          "success"
        );

        stopScanner();

        setTimeout(function() {

          window.location.href =
            returnUrl +
            "?id=" +
            encodeURIComponent(value);

        }, 700);

        return;
      }


      // ==========================================
      // 出庫
      // ==========================================

      if (mode === "stockout") {

        setMessage(
          "✅ 読み取りました\n\n" +
          value +
          "\n\n" +
          "出庫処理画面へ戻ります。",
          "success"
        );

        stopScanner();

        setTimeout(function() {

          window.location.href =
            returnUrl +
            "?id=" +
            encodeURIComponent(value) +
            "&stockout=1";

        }, 700);

        return;
      }
    }


    // ==========================================
    // QR読み取り失敗
    // ※何も表示しない
    // ==========================================

    function onScanFailure(error) {
      // 読み取り途中のエラーは無視
    }


    // ==========================================
    // カメラ停止
    // ==========================================

    function stopScanner() {

      if (!scanner) {
        scanning = false;
        setButtonState(false);
        return;
      }

      scanner.stop()
        .then(function() {

          scanning = false;

          setButtonState(false);

        })
        .catch(function(error) {

          console.log("カメラ停止エラー:", error);

          scanning = false;

          setButtonState(false);
        });
    }


    // ==========================================
    // 戻る
    // ==========================================

    function goBack() {

      stopScanner();

      setTimeout(function() {

        window.location.href = returnUrl;

      }, 200);
    }


    // ==========================================
    // 画面を開いたとき
    // ==========================================

    window.onload = function() {

      if (mode === "stockout") {

        setMessage(
          "📦 出庫用QR読み取り\n\n" +
          "商品QRコードを読み取ってください。",
          ""
        );

      } else {

        setMessage(
          "📥 入庫用QR読み取り\n\n" +
          "納品書のQRコードを読み取ってください。",
          ""
        );
      }

    };

  </script>

</body>
</html>
