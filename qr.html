<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>QRコード読み取り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    #reader {
      width: 100%;
      min-height: 80px;
      overflow: hidden;
      border-radius: 10px;
      background: #111;
    }

    #message {
      margin: 15px 0;
      text-align: center;
      white-space: pre-line;
      font-weight: bold;
      line-height: 1.6;
    }

    .error {
      color: #d32f2f;
    }

    .success {
      color: #2e7d32;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #2e7d32;
    }

    #stopButton {
      background: #d32f2f;
      display: none;
    }

    #backButton {
      background: #1976d2;
    }

    button:disabled {
      background: #999 !important;
      cursor: default;
    }

    .hint {
      margin-top: 16px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QRコード読み取り</h1>

  <div class="card">

    <div id="reader"></div>

    <div id="message">
      「カメラを起動」を押してください。
    </div>

    <button
      id="startButton"
      type="button"
      onclick="startScanner()">
      📷 カメラを起動
    </button>

    <button
      id="stopButton"
      type="button"
      onclick="stopScanner()">
      カメラを停止
    </button>

    <button
      id="backButton"
      type="button"
      onclick="goBack()">
      ← 入庫管理へ戻る
    </button>

    <div class="hint">
      QRコードをカメラ中央の枠内に入れてください。<br>
      読み取り成功後、自動的に入庫管理画面へ戻ります。
    </div>

  </div>

</div>


<!-- QR読み取りライブラリ -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>


<script>

  /* =========================================================
     基本設定
     ========================================================= */

  var scanner = null;
  var scanning = false;
  var finished = false;

  /*
   * Apps Script の戻り先
   *
   * 商品QRを読んだ場合、
   *
   * ?id=商品コード&stockout=1
   *
   * を付けて戻る。
   */
  var DEFAULT_RETURN_URL =
    "https://script.google.com/macros/s/AKfycbwzNo1eSSIO3i2VA7UjLUj9Rj4kEWKiQPfx8xYWMuLLYoc2v5Dtkh5TY8F502Za72Q/exec";


  /*
   * URLパラメータ
   */
  var params = new URLSearchParams(window.location.search);

  /*
   * return が渡されていればそれを使用。
   * 渡されていなくても DEFAULT_RETURN_URL を使用。
   */
  var returnUrl =
    params.get("return") || DEFAULT_RETURN_URL;



  /* =========================================================
     メッセージ表示
     ========================================================= */

  function setMessage(text, className) {

    var message = document.getElementById("message");

    message.textContent = text;

    message.className = className || "";
  }



  /* =========================================================
     ボタン表示
     ========================================================= */

  function setButtonState(running) {

    document.getElementById("startButton").style.display =
      running ? "none" : "block";

    document.getElementById("stopButton").style.display =
      running ? "block" : "none";
  }



  /* =========================================================
     カメラ開始
     ========================================================= */

  function startScanner() {

    if (scanning) {
      return;
    }

    if (typeof Html5Qrcode === "undefined") {

      setMessage(
        "QR読み取りライブラリを読み込めませんでした。\n" +
        "インターネット接続を確認してください。",
        "error"
      );

      return;
    }

    scanner = new Html5Qrcode("reader");

    scanning = true;
    finished = false;

    setButtonState(true);

    setMessage(
      "カメラを起動しています...",
      ""
    );


    /*
     * QRコードの読み取り設定
     */
    var config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        var size = Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.72
        );

        size = Math.max(
          180,
          Math.min(size, 320)
        );

        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0
    };


    /*
     * 背面カメラを使用
     */
    scanner.start(
      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    ).then(function() {

      setMessage(
        "カメラ起動済みです。\n" +
        "QRコードを映してください。",
        ""
      );

    }).catch(function(error) {

      console.error(
        "camera start error:",
        error
      );

      showCameraError(error);
    });
  }



  /* =========================================================
     読み取り失敗
     ========================================================= */

  function onScanFailure(errorMessage) {

    /*
     * 読み取り中の一時的な失敗は
     * 画面に表示しない。
     */

  }



  /* =========================================================
     QR読み取り成功
     ========================================================= */

  function onScanSuccess(decodedText) {

    /*
     * 二重読み取り防止
     */
    if (finished) {
      return;
    }

    finished = true;


    /*
     * 読み取った文字列
     */
    var value =
      String(decodedText || "").trim();


    if (!value) {

      finished = false;

      return;
    }


    /*
     * =====================================================
     * URL形式のQRにも対応
     *
     * 例：
     * https://xxxxx/exec?id=te-pu
     *
     * ↓
     *
     * te-pu
     * =====================================================
     */

    try {

      var qrUrl = new URL(value);

      var qrId =
        qrUrl.searchParams.get("id");

      if (qrId) {

        value =
          String(qrId).trim();
      }

    } catch (error) {

      /*
       * URLではない普通の文字列なら
       * そのまま商品コードとして使用。
       */

    }


    if (!value) {

      setMessage(
        "QRコードの内容が空です。",
        "error"
      );

      finished = false;

      return;
    }


    /*
     * 読み取り成功表示
     */
    setMessage(
      "読み取りました：\n" +
      value +
      "\n\n出庫処理画面へ戻ります...",
      "success"
    );


    /*
     * カメラを停止してから戻る
     */
    stopScanner().then(function() {

      /*
       * 少しだけ待ってから画面遷移
       */
      setTimeout(function() {

        goBackWithId(value);

      }, 300);

    });
  }



  /* =========================================================
     カメラ停止
     ========================================================= */

  function stopScanner() {

    if (!scanner || !scanning) {

      scanning = false;

      setButtonState(false);

      return Promise.resolve();
    }


    return scanner.stop()

      .catch(function(error) {

        console.warn(
          "scanner.stop:",
          error
        );

      })

      .then(function() {

        try {

          scanner.clear();

        } catch (error) {

          console.warn(
            "scanner.clear:",
            error
          );
        }


        scanner = null;

        scanning = false;

        setButtonState(false);
      });
  }



  /* =========================================================
     カメラエラー
     ========================================================= */

  function showCameraError(error) {

    scanning = false;

    setButtonState(false);


    var detail = "";


    if (error && error.name) {

      detail =
        "\nエラー：" +
        error.name;
    }


    setMessage(

      "カメラを起動できませんでした。\n\n" +

      "① ブラウザのカメラ許可を確認してください。\n" +

      "② カメラを使用している他のアプリを閉じてください。\n" +

      "③ スマートフォンの場合はHTTPSで開いているか確認してください。" +

      detail,

      "error"
    );


    try {

      if (scanner) {

        scanner.clear();
      }

    } catch (e) {

      console.warn(e);
    }


    scanner = null;
  }



  /* =========================================================
     戻り先URLを作成
     ========================================================= */

  function buildReturnUrl(value) {

    /*
     * Apps Script URLをコピーして作成
     */
    var url =
      new URL(returnUrl);


    /*
     * 商品コード
     */
    url.searchParams.set(
      "id",
      value
    );


    /*
     * 出庫処理モード
     */
    url.searchParams.set(
      "stockout",
      "1"
    );


    return url.toString();
  }



  /* =========================================================
     商品コード付きでApps Scriptへ戻る
     ========================================================= */

  function goBackWithId(value) {

    var targetUrl =
      buildReturnUrl(value);


    console.log(
      "QR return URL:",
      targetUrl
    );


    /*
     * 新しいタブから開かれている場合
     *
     * 元のタブを更新して、
     * QRタブを閉じる。
     */
    if (
      window.opener &&
      !window.opener.closed
    ) {

      try {

        window.opener.location.href =
          targetUrl;

        window.close();

        return;

      } catch (error) {

        console.warn(
          "window.opener:",
          error
        );
      }
    }


    /*
     * =====================================================
     * 重要
     *
     * window.opener が無い場合は
     * 現在のQR画面から直接Apps Scriptへ移動。
     *
     * window.location.href ではなく
     * window.top.location.href を使用。
     * =====================================================
     */

    window.top.location.href =
      targetUrl;
  }



  /* =========================================================
     戻るボタン
     ========================================================= */

  function goBack() {

    /*
     * カメラが動いていたら停止
     */
    stopScanner().then(function() {

      /*
       * 商品コードを付けずに
       * Apps Scriptの最初の画面へ戻る。
       */
      window.top.location.href =
        returnUrl;

    });
  }



  /* =========================================================
     ページを閉じる・移動する前にカメラ停止
     ========================================================= */

  window.addEventListener(
    "beforeunload",
    function() {

      if (
        scanner &&
        scanning
      ) {

        try {

          scanner.stop();

        } catch (error) {

          console.warn(error);
        }
      }
    }
  );

</script>

</body>
</html>
